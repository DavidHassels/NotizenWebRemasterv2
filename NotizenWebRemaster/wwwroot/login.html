<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Anmelden</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="login.js" defer></script>
</head>
<body class="min-h-screen bg-white flex items-center justify-center p-4 text-neutral-200 antialiased">

    <main class="w-full max-w-[400px]">

        <div class="mb-8 text-center">
            <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-xl bg-neutral-800 ring-1 ring-neutral-700">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-neutral-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 10-8 0v4m-2 0h12a1 1 0 011 1v8a1 1 0 01-1 1H6a1 1 0 01-1-1v-8a1 1 0 011-1z"/>
                </svg>
            </div>
            <h1 class="text-2xl font-semibold tracking-tight text-neutral-900">Willkommen zurück</h1>
            <p class="mt-1 text-sm text-neutral-500">Melde dich an, um fortzufahren</p>
        </div>

        <div class="rounded-2xl bg-neutral-800 p-6 shadow-2xl ring-1 ring-neutral-700">
            <form id="loginForm" class="space-y-5">
                <div class="flex flex-col">
                    <label for="benutzer" class="mb-1.5 text-xs font-medium uppercase tracking-wider text-neutral-400">Benutzername</label>
                    <input id="benutzer" type="text" autocomplete="username" required
                           class="w-full rounded-lg border border-neutral-700 bg-neutral-900 px-3 py-2.5 text-sm text-white placeholder-neutral-500 transition focus:border-neutral-400 focus:outline-none focus:ring-2 focus:ring-neutral-600">
                </div>

                <div class="flex flex-col">
                    <label for="passwort" class="mb-1.5 text-xs font-medium uppercase tracking-wider text-neutral-400">Passwort</label>
                    <input id="passwort" type="password" autocomplete="current-password" required
                           class="w-full rounded-lg border border-neutral-700 bg-neutral-900 px-3 py-2.5 text-sm text-white placeholder-neutral-500 transition focus:border-neutral-400 focus:outline-none focus:ring-2 focus:ring-neutral-600">
                </div>

                <p id="fehler" class="hidden rounded-lg border border-red-900 bg-red-950 px-3 py-2 text-sm text-red-400"></p>

                <button type="submit"
                        class="w-full rounded-lg bg-white px-4 py-2.5 text-sm font-semibold text-neutral-900 shadow transition hover:bg-neutral-200 active:bg-neutral-300 disabled:cursor-not-allowed disabled:opacity-50">
                    Anmelden
                </button>
            </form>
        </div>

    </main>

</body>
</html>
