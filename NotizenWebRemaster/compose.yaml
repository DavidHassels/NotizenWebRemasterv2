# Comments are provided throughout this file to help you get started.
# If you need more help, visit the Docker Compose reference guide at
# https://docs.docker.com/go/compose-spec-reference/

# Here the instructions define your application as a service called "server".
# This service is built from the Dockerfile in the current directory.
# You can add other services your application may depend on here, such as a
# database or a cache. For examples, see the Awesome Compose repository:
# https://github.com/docker/awesome-compose
services:

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
     - "7029:80"
    depends_on:
     - server
    
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    command: start-dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${PG_Host}:${PG_Port}/${PG_DB}
      KC_DB_USERNAME: ${PG_User}
      KC_DB_PASSWORD: ${PG_Password}

      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_Admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_Password}
      KC_HTTP_ENABLED: "true"

    ports:
     - "8080:8080"



  server:
    build:
      context: .
      target: final
    environment:
      - ConnectionStrings__Default=Host=${PG_Host};Port=${PG_Port};Database=${PG_DB};Username=${PG_User};Password=${PG_Password}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=${PG_Password}
      - POSTGRES_DB=${PG_Host}
    volumes:
      - pgdaten:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_User} -d ${PG_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdaten:


