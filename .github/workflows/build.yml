name: build and test code


on:
  push:
    branches: ["main"]
    
  pull_request:
    branches: ["main"]
    
  workflow_dispatch: 
    
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: dotnet-setup
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'
    - name: Restore
      run: dotnet restore NotizenWebRemaster.slnx
    - name: Build
      run: dotnet build NotizenWebRemaster.slnx --no-restore --configuration Release
    - name: Test
      run: dotnet test NotizenWebRemaster.slnx --no-build --configuration Release

      
    
    
  
  
