server {
	listen 80;
	
	root /usr/share/nginx/html;
	index index.html;

	location /api {
		proxy_pass http://server:8080;
		proxy_set_header Host $http_host;
		proxy_set_header X-Forwarded-For $remote_addr;

		proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_busy_buffers_size 32k;
	}
}