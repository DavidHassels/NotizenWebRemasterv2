<!DOCTYPE html>
<html lang="de">
<head>


    <meta charset="utf-8">
    <title>Artikel</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body>

    <script src="Skript.js"></script>
    <script>LoadPage()</script>

    <div id="benutzerBereich" class="fixed top-4 right-4 flex flex-col items-end gap-2">
        <span id="benutzerName" class="text-sm font-medium text-neutral-800"></span>
        <button id="logoutBtn" type="button" onclick="Logout()"
                class="rounded-lg bg-neutral-800 px-4 py-1.5 text-sm font-medium text-white shadow transition-colors hover:bg-neutral-700 active:bg-neutral-900">
            Abmelden
        </button>
    </div>

    <h1 class="max-w-2xl px-1 py-1 text-4xl  bg-black w-fit font-bold text-white mb-6"> Einkaufsliste </h1>
    <div class="mx-auto max-w-2xl">

        <div class="flex gap-4 mb-4 justify-around">

            <div class="flex flex-col">
                <label for="name">Name:</label>
                <input class="border border-gray-600 rounded px-2 py-1" type="text" id="name">
            </div>

            <div class="flex flex-col">
                <label for="preis">Preis:</label>
                <input class="border border-gray-600 rounded px-2 py-1" type="number" id="preis" step="0.01">
            </div>
        </div>
        <div style="display: flex;" class="flex justify-around mb-4">
            <button class="bg-neutral-800 text-white font-medium px-4 py-2 rounded-lg shadow hover:bg-neutral-300 active:bg-neutral-200" id="speichern" onclick="add()">Speichern</button>
            <button class="bg-neutral-800 text-white font-medium px-4 py-2 rounded-lg shadow hover:bg-neutral-300 active:bg-neutral-200" id="löschen" onclick="HandleRemoveList()">Löschen</button>
            <button class="bg-neutral-800 text-white font-medium px-4 py-2 rounded-lg shadow hover:bg-neutral-300 active:bg-neutral-200" id="setzerl" onclick="HandleDoneList()">Abhaken</button>
        </div>

        <p id="meldung" , style="color:red"></p>
        <ol id="liste"></ol>



        <div class="mx-auto max-w-2xl table-auto">
            <table id="table" class="w-full text-left table-auto mb-20">
                <thead>
                    <tr class="border-b border-black-200 bg-neutral-100 text-base font-medium text-slate-600 dark:bg-slate-900">
                        <th class="py-2">Auswahl</th>
                        <th class="py-2">Name</th>
                        <th class="py-2">Preis</th>
                        <th class="py-2">Status</th>
                    </tr>
                </thead>
                <tbody id="atbody"></tbody>
            </table>
            <div class="flex flex-row justify-around">

                <p id="statc"></p>
                <div class="flex flex-col items-center">
                    <p class="mb-4">Liste offener Artikel</p>
                    <p id="statlist" class="justify-center"></p>
                </div>
                <p id="statsum"></p>

            </div>
        </div>

    </div>

</body>
</html>
