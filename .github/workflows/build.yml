name: build and test code


on:
  push:
    branches: ["main"]
    
  pull_request:
    branches: ["main"]
    
  workflow_dispatch: 
    
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: dotnet-setup
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'
    - run: dotnet restore
    - run: dotnet build --no-restore --configuration Release

      
    
    
  
  
